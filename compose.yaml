# Local end-to-end harness using the real AgentCore Runtime implementation.
# Export
# OPENROUTER_API_KEY and E2B_API_KEY before starting the stack and build the
# WORKER_E2B_TEMPLATE described in packages/agent-worker/e2b-template/.
#
# Services (non-secret wiring inline; local-only dev credentials):
#   postgres      — the writable mymemo_agent DB (conversations/runs/run_events)
#                   AND the read-only mymemo_kb (seeded for the retained doc path)
#   migrate       — one-shot: applies the @mymemo/agent-db migrations, then exits
#   chat-api      — creates Conversations, admits Runs, and attaches SSE
#   agentcore-runtime — acquires one exact Dispatch and serves its Run
#   dispatch-bridge — polls the durable outbox and invokes the local Runtime
#   redis         — disposable Redis 7 for real relay contract testing
#   artifact-store — disposable S3-compatible Downloadable artifact storage
#
# The prototype gateway/sandbox services were removed once the split runtime
# replaced them end to end (ADR-0002). Bring the demo up with:
#     docker compose up --build

x-runtime-environment: &runtime-environment
  ARTIFACT_BUCKET: "mymemo-agent-local-artifacts"
  AWS_REGION: "us-west-2"
  AWS_EC2_METADATA_DISABLED: "true"
  LOCAL_ARTIFACT_ENDPOINT: "http://127.0.0.1:9000"

services:
  chat-api:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
      target: local
    # Share the local Redis network namespace so the deliberately narrow plaintext
    # development escape hatch can use the literal loopback host.
    network_mode: "service:redis"
    environment:
      <<: *runtime-environment
      # chat-api's writable database (mymemo_agent): conversations, runs,
      # run_events. Local-only dev credential, so inline. Named AGENT_DATABASE_URL
      # so it never collides with the worker's read-only KB DATABASE_URL.
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      AWS_ACCESS_KEY_ID: "local-artifact-reader"
      AWS_SECRET_ACCESS_KEY: "local-artifact-reader-secret"
      DB_SSL: disable
      LOG_LEVEL: info
      REDIS_URL: redis://127.0.0.1:6379
      LIVE_STREAM_ALLOW_INSECURE_LOCAL_REDIS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      artifact-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  agentcore-runtime:
    build:
      context: .
      dockerfile: apps/agentcore-runtime/Dockerfile
      target: local
    network_mode: "service:redis"
    environment:
      <<: *runtime-environment
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      AWS_ACCESS_KEY_ID: "local-artifact-writer"
      AWS_SECRET_ACCESS_KEY: "local-artifact-writer-secret"
      DB_SSL: disable
      LOG_LEVEL: info
      WORKER_HEARTBEAT_INTERVAL_MS: "2000"
      KB_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_kb
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-sonnet-4}
      E2B_API_KEY: ${E2B_API_KEY:?Set E2B_API_KEY}
      WORKER_E2B_TEMPLATE: ${WORKER_E2B_TEMPLATE:-mymemo-agent-sandbox}
      REDIS_URL: redis://127.0.0.1:6379
      LIVE_STREAM_ALLOW_INSECURE_LOCAL_REDIS: "true"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/ping');process.exit(r.ok?0:1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      artifact-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatch-bridge:
    build:
      context: .
      dockerfile: apps/agentcore-local-dispatch-bridge/Dockerfile
      target: local
    network_mode: "service:redis"
    environment:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      DB_SSL: disable
      AGENTCORE_RUNTIME_URL: http://127.0.0.1:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      agentcore-runtime:
        condition: service_healthy
    restart: unless-stopped

  smoke:
    image: oven/bun:1
    network_mode: "service:redis"
    command: ["bun", "run", "/workspace/scripts/smoke/local-agentcore-smoke.ts"]
    environment:
      AGENT_SMOKE_BASE_URL: http://127.0.0.1:3000
    volumes:
      - ./scripts/smoke:/workspace/scripts/smoke:ro
      - ./packages/test-support:/workspace/packages/test-support:ro
    depends_on:
      chat-api:
        condition: service_started
      dispatch-bridge:
        condition: service_started
      artifact-bucket:
        condition: service_completed_successfully
    restart: "no"

  # Local-only S3-compatible object store. The trusted Runtime uploads private
  # objects here and chat-api signs loopback URLs that the smoke downloads.
  artifact-store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    network_mode: "service:redis"
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: "local-artifact-admin"
      MINIO_ROOT_PASSWORD: "local-artifact-admin-secret"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  artifact-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    network_mode: "service:redis"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://127.0.0.1:9000 local-artifact-admin local-artifact-admin-secret
        && mc mb --ignore-existing local/mymemo-agent-local-artifacts
        && mc admin user add local local-artifact-reader local-artifact-reader-secret
        && mc admin policy attach local readonly --user local-artifact-reader
        && mc admin user add local local-artifact-writer local-artifact-writer-secret
        && mc admin policy attach local writeonly --user local-artifact-writer
    depends_on:
      artifact-store:
        condition: service_healthy
    restart: "no"

  # One-shot: apply the writable DB (mymemo_agent) schema from Drizzle migrations,
  # then exit. The postgres init only creates the database; the tables are owned
  # by migrations in the shared @mymemo/agent-db package
  # (packages/agent-db/src/schema.ts -> packages/agent-db/drizzle/). chat-api waits
  # for this to complete so its run/conversation tables exist before it serves.
  # Reuses the chat-api image (which ships packages/agent-db/drizzle); runs to
  # completion, no restart.
  migrate:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
    # Override the image ENTRYPOINT (bun run src/index.ts) rather than CMD — the
    # image sets no CMD, so a `command:` would append to the entrypoint instead.
    entrypoint: ["bun", "run", "db:migrate"]
    environment:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      DB_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - mymemo-network

  # Disposable development Redis. It binds only to host loopback, keeps no
  # volume or persistence, and exercises the same pub/sub relay used in
  # production. Start it alone with `docker compose up redis`.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
      - "3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"
    networks:
      - mymemo-network

  # The worker's read-only KB (mymemo_kb) is seeded here with the KB schema + FTS
  # and a small fixture (see packages/agent-worker/db/init.sql) so document
  # search/fetch return results for the seeded member. Local-only dev
  # credentials, inline.
  postgres:
    # Pinned to the major production runs (RDS `agent_db_engine_version`), so
    # local behaviour is evidence about production. Bumping the major strands
    # the existing `pgdata` volume, which the server refuses to start against —
    # `docker compose down -v` before the first run on a new major.
    image: postgres:17
    environment:
      POSTGRES_USER: mymemo
      POSTGRES_PASSWORD: mymemo
      POSTGRES_DB: mymemo_kb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Two databases on one instance: the worker's read-only KB (mymemo_kb,
      # seeded here) and chat-api's writable mymemo_agent.
      - ./packages/agent-worker/db/init.sql:/docker-entrypoint-initdb.d/00-kb.sql:ro
      - ./apps/chat-api/db/init.sql:/docker-entrypoint-initdb.d/10-chat-api.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymemo -d mymemo_kb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - mymemo-network

networks:
  mymemo-network:
    driver: bridge

volumes:
  pgdata:
