# Local end-to-end harness — split runtime (Milestone 3). The client contract is
# chat-api's /v1 conversation API: create a conversation, POST a user.message,
# and read the turn back as SSE. A queued turn is claimed and processed by the
# agent-worker; chat-api projects the run's durable events (run_events) back to
# the client. In Milestone 3 the worker runs a SYNTHETIC processor (one text
# event per run), so this harness needs no provider/KB/E2B credentials to
# demonstrate the full path: create conversation → user.message → agent-worker
# claims the run → text_delta → done.
#
# Split-runtime services (non-secret wiring inline; local-only dev credentials):
#   postgres      — the writable mymemo_agent DB (conversations/runs/run_events)
#                   AND the read-only mymemo_kb (seeded for the retained doc path)
#   migrate       — one-shot: applies the @mymemo/agent-db migrations, then exits
#   chat-api      — creates conversations, queues runs, projects run events as SSE
#   agent-worker  — claims queued runs, heartbeats, runs the synthetic turn
#
# The prototype gateway/sandbox services were removed once the split runtime
# replaced them end to end (ADR-0002). Bring the demo up with:
#     docker compose up --build

services:
  chat-api:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # chat-api's writable database (mymemo_agent): conversations, runs,
      # run_events. Local-only dev credential, so inline. Named AGENT_DATABASE_URL
      # so it never collides with the worker's read-only KB DATABASE_URL.
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      DB_SSL: disable
      LOG_LEVEL: info
      # Open the agent exposure gate locally without wiring Statsig (break-glass).
      AGENT_EXPOSURE_BREAK_GLASS: "true"
    # No secrets: after the hard swap (ADR-0002) chat-api mints no tokens and
    # holds no provider/KB credentials — it only queues runs and projects events.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - mymemo-network

  # Claims queued runs from the shared mymemo_agent DB, heartbeats ownership, and
  # processes each with the Milestone 3 SYNTHETIC turn (one text_delta event),
  # then terminalizes `done`. The worker-only credentials (KB, OpenRouter, E2B)
  # are validated at boot but unused by the synthetic processor — placeholder
  # values keep the worker booting until the document/model/E2B milestones.
  agent-worker:
    build:
      context: .
      dockerfile: apps/agent-worker/Dockerfile
    environment:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      DB_SSL: disable
      LOG_LEVEL: info
      # The control loop ticks (claim + heartbeat) at this interval; keep it short
      # locally so a queued run is picked up promptly (prod default is 15s).
      WORKER_HEARTBEAT_INTERVAL_MS: "2000"
      # Required at boot, unused by the synthetic processor (Milestones 6/7):
      KB_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_kb
      OPENROUTER_API_KEY: local-unused
      OPENROUTER_BASE_URL: https://openrouter.ai/api
      OPENROUTER_DEFAULT_MODEL: anthropic/claude-sonnet-4
      E2B_API_KEY: local-unused
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - mymemo-network

  # One-shot: apply the writable DB (mymemo_agent) schema from Drizzle migrations,
  # then exit. The postgres init only creates the database; the tables are owned
  # by migrations in the shared @mymemo/agent-db package
  # (packages/agent-db/src/schema.ts -> packages/agent-db/drizzle/). chat-api waits
  # for this to complete so its run/conversation tables exist before it serves.
  # Reuses the chat-api image (which ships packages/agent-db/drizzle); runs to
  # completion, no restart.
  migrate:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
    # Override the image ENTRYPOINT (bun run src/index.ts) rather than CMD — the
    # image sets no CMD, so a `command:` would append to the entrypoint instead.
    entrypoint: ["bun", "run", "db:migrate"]
    environment:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@postgres:5432/mymemo_agent
      DB_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - mymemo-network

  # The worker's read-only KB (mymemo_kb) is seeded here with the KB schema + FTS
  # and a small fixture (see apps/agent-worker/db/init.sql) so document
  # search/fetch return results for the seeded member. Local-only dev
  # credentials, inline.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mymemo
      POSTGRES_PASSWORD: mymemo
      POSTGRES_DB: mymemo_kb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Two databases on one instance: the worker's read-only KB (mymemo_kb,
      # seeded here) and chat-api's writable mymemo_agent.
      - ./apps/agent-worker/db/init.sql:/docker-entrypoint-initdb.d/00-kb.sql:ro
      - ./apps/chat-api/db/init.sql:/docker-entrypoint-initdb.d/10-chat-api.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymemo -d mymemo_kb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - mymemo-network

networks:
  mymemo-network:
    driver: bridge

volumes:
  pgdata:
