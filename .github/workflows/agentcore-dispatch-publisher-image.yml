name: AgentCore dispatch publisher image

on:
  pull_request:
    paths:
      - apps/agentcore-dispatch-publisher/**
      - apps/agentcore-canary-dispatch/**
      - packages/agent-db/**
      - scripts/smoke/agentcore-dispatch-publisher-image-check.sh
      - package.json
      - bun.lock
      - .github/workflows/agentcore-dispatch-publisher-image.yml
  push:
    branches: [main]
    paths:
      - apps/agentcore-dispatch-publisher/**
      - apps/agentcore-canary-dispatch/**
      - packages/agent-db/**
      - scripts/smoke/agentcore-dispatch-publisher-image-check.sh
      - package.json
      - bun.lock
      - .github/workflows/agentcore-dispatch-publisher-image.yml

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build AgentCore dispatch publisher image
        run: >-
          docker build --platform linux/amd64
          -f apps/agentcore-dispatch-publisher/Dockerfile
          -t mymemo-agentcore-dispatch-publisher:image-check .
      - name: Verify AgentCore dispatch publisher image
        run: scripts/smoke/agentcore-dispatch-publisher-image-check.sh mymemo-agentcore-dispatch-publisher:image-check
