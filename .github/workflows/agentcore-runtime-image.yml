name: AgentCore Runtime image

on:
  pull_request:
    paths:
      - apps/agent-runtime/**
      - packages/ui-catalog/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - bun.lock
      - .dockerignore
      - scripts/smoke/agentcore-runtime-image-check.sh
      - .github/workflows/agentcore-runtime-image.yml

concurrency:
  group: agentcore-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-runtime-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build agent-runtime ARM64 image
        run: docker build --platform linux/arm64 -f apps/agent-runtime/Dockerfile -t mymemo-agent-runtime:image-check .
      - name: Verify pinned SDK stream without a model key
        # Hand's shell emulation runs in the full CI suite, which has the sandbox
        # toolchain. Python and rg belong in Code Interpreter, not this image.
        run: docker run --rm --entrypoint bun mymemo-agent-runtime:image-check test --timeout=60000 src/runtime.test.ts src/config.test.ts
