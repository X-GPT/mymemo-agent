name: AgentCore Runtime image

on:
  pull_request:
    paths:
      - apps/agentcore-runtime/**
      - apps/agent-runtime/**
      - apps/agentcore-dispatch-consumer/**
      - packages/agent-db/**
      - packages/agentcore-dispatch/**
      - packages/live-text/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - bun.lock
      - .dockerignore
      - scripts/smoke/agentcore-runtime-image-check.sh
      - .github/workflows/agentcore-runtime-image.yml

concurrency:
  group: agentcore-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 AgentCore Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentcore-runtime/Dockerfile
          platforms: linux/arm64
          load: true
          tags: mymemo-agentcore-runtime:image-check
      - name: Verify request-oriented image offline
        run: scripts/smoke/agentcore-runtime-image-check.sh mymemo-agentcore-runtime:image-check

  agent-runtime-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build no-tools Runtime ARM64 image
        run: docker build --platform linux/arm64 -f apps/agent-runtime/Dockerfile -t mymemo-agent-runtime:image-check .
      - name: Verify pinned SDK stream without a model key
        run: docker run --rm --entrypoint bun mymemo-agent-runtime:image-check test --timeout=60000 src/runtime.test.ts
