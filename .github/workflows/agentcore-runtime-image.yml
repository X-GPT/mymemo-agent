name: AgentCore Runtime image

on:
  push:
    branches:
      - main
    paths:
      - apps/agentcore-runtime/**
      - apps/agentcore-dispatch-consumer/**
      - apps/agent-worker/**
      - packages/agent-db/**
      - packages/agentcore-dispatch/**
      - packages/live-text/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - bun.lock
      - .dockerignore
      - scripts/smoke/agentcore-runtime-image-check.sh
      - .github/workflows/agentcore-runtime-image.yml
  pull_request:
    paths:
      - apps/agentcore-runtime/**
      - apps/agentcore-dispatch-consumer/**
      - apps/agent-worker/**
      - packages/agent-db/**
      - packages/agentcore-dispatch/**
      - packages/live-text/**
      - apps/*/package.json
      - packages/*/package.json
      - package.json
      - bun.lock
      - .dockerignore
      - scripts/smoke/agentcore-runtime-image-check.sh
      - .github/workflows/agentcore-runtime-image.yml

concurrency:
  group: agentcore-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 AgentCore Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentcore-runtime/Dockerfile
          platforms: linux/arm64
          load: true
          tags: mymemo-agentcore-runtime:image-check
      - name: Verify request-oriented image offline
        run: scripts/smoke/agentcore-runtime-image-check.sh mymemo-agentcore-runtime:image-check
