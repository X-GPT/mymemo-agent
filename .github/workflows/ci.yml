name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR. Keyed on the PR number, so pushes
# to one PR cancel each other and nothing else.
#
# A push to main has no pull_request.number and falls back to the unique run
# id, so main CI runs do not cancel one another and each commit keeps its own
# verification record before an operator manually dispatches a release.
#
# Groups are repository-wide, not per-workflow, hence the `ci-` prefix.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — match the version the lockfile was
          # generated with. Bump deliberately alongside local upgrades.
          bun-version: 1.3.0
      # The runner image does not include ripgrep. Install the same pinned,
      # checksum-verified package used by the production E2B template.
      - name: Install pinned ripgrep test dependency
        env:
          RIPGREP_VERSION: "14.1.1"
          RIPGREP_SHA256: 2f0c732ef166b4f7be7190d4012d60b3f8467bdd6f795c0598817bd2ac1706ae
        run: |
          package="ripgrep_${RIPGREP_VERSION}-1_amd64.deb"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${package}"
          curl --fail --location --silent --show-error --output "/tmp/${package}" "${url}"
          echo "${RIPGREP_SHA256}  /tmp/${package}" | sha256sum --check -
          sudo dpkg --install "/tmp/${package}"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun test e2e/relay-failure-matrix.integration.test.ts

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check
      - name: Verify backendless provider initialization and lock file
        run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate

  # The agent-worker image build lives in worker-image.yml, path-filtered.

  # AgentCore ownership and dispatch races that require concurrent database
  # sessions run against the production Postgres major on every PR.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The major production runs (RDS `agent_db_engine_version`). The
        # concurrency suite below is only evidence about production while these
        # match.
        image: postgres:17
        env:
          POSTGRES_USER: mymemo
          POSTGRES_PASSWORD: mymemo
          POSTGRES_DB: mymemo_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymemo -d mymemo_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@localhost:5432/mymemo_agent
      DB_SSL: disable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      # Apply the @mymemo/agent-db migrations to the service DB before the apps boot.
      - run: bun run db:migrate
        working-directory: apps/chat-api
      # Reclamation uses SKIP LOCKED and needs concurrent real-Postgres sessions.
      - run: bun test packages/agent-db/src/conversation-ownership.postgres.test.ts
      # The AgentCore publisher/acquisition races use the same migrated
      # real-Postgres service as the surrounding integration suites.
      - run: bun test packages/agent-db/src/agentcore-dispatch.postgres.test.ts
      # The dedicated publisher task's session lock must exclude a rolling-
      # deploy overlap and release when its database backend dies.
      - run: RUN_AGENTCORE_PUBLISHER_POSTGRES_TESTS=true bun test apps/agentcore-dispatch-publisher/src/publisher-loop.postgres.test.ts
