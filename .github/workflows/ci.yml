name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — match the version the lockfile was
          # generated with. Bump deliberately alongside local upgrades.
          bun-version: 1.3.0
      # Integration tests drive real ripgrep plus disposable Redis processes for
      # Stream and Lua contracts; the runner image does not ship either executable.
      - name: Install real Redis and ripgrep test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep redis-server
      - run: bun install --frozen-lockfile
      - run: bun run test

  # Build the final production-pruned image and exercise the SDK's native CLI
  # inside it. This needs no runtime credentials and catches both optional-dep
  # pruning and the Debian/glibc vs musl platform-binary trap.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build agent-worker image
        run: >-
          docker build --platform linux/amd64
          -f apps/agent-worker/Dockerfile
          -t mymemo-agent-worker:image-check .
      - name: Exec-verify pinned Claude CLI
        run: scripts/smoke/agent-worker-image-check.sh mymemo-agent-worker:image-check

  # Split-runtime AG-UI integration: runs chat-api plus a deterministic
  # test-only worker against real Postgres and Redis, so atomic admission,
  # durable completion, and the retained per-Run stream are exercised on every
  # PR without live provider credentials. Task 9.7 owns the production SDK
  # path's credentialed smoke.
  # `e2e/integration.test.ts` is gated on AGENT_DATABASE_URL.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mymemo
          POSTGRES_PASSWORD: mymemo
          POSTGRES_DB: mymemo_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymemo -d mymemo_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@localhost:5432/mymemo_agent
      DB_SSL: disable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: bun install --frozen-lockfile
      # Apply the @mymemo/agent-db migrations to the service DB before the apps boot.
      - run: bun run db:migrate
        working-directory: apps/chat-api
      - run: bun test e2e/integration.test.ts
