name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR. Keyed on the PR number, so pushes
# to one PR cancel each other and nothing else.
#
# A push to main has no pull_request.number and falls back to the unique run
# id, so main CI runs do not cancel one another and each commit keeps its own
# verification record before an operator manually dispatches a release.
#
# Groups are repository-wide, not per-workflow, hence the `ci-` prefix.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — match the version the lockfile was
          # generated with. Bump deliberately alongside local upgrades.
          bun-version: 1.3.0
      # The runner image does not include ripgrep. Install the same pinned,
      # checksum-verified package needed by the Hand tests.
      - name: Install pinned ripgrep test dependency
        env:
          RIPGREP_VERSION: "14.1.1"
          RIPGREP_SHA256: 2f0c732ef166b4f7be7190d4012d60b3f8467bdd6f795c0598817bd2ac1706ae
        run: |
          package="ripgrep_${RIPGREP_VERSION}-1_amd64.deb"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${package}"
          curl --fail --location --silent --show-error --output "/tmp/${package}" "${url}"
          echo "${RIPGREP_SHA256}  /tmp/${package}" | sha256sum --check -
          sudo dpkg --install "/tmp/${package}"
      - run: bun install --frozen-lockfile
      - run: bun run test

  dynamodb:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Wait for DynamoDB Local
        run: curl --silent --show-error --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused "$TEST_DYNAMODB_ENDPOINT"
      - run: bun test apps/agent-front

  front-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - run: bun install --frozen-lockfile
      - name: Verify Node.js 22 ARM64 Lambda package
        run: |
          scripts/deploy/build_front.sh
          unzip -q dist/agent-front/front.zip -d "${RUNNER_TEMP}/front-package"
          docker run --rm --platform linux/arm64 --network none \
            --entrypoint /var/lang/bin/node \
            --volume "${RUNNER_TEMP}/front-package:/var/task:ro" \
            --volume "${PWD}/scripts/smoke/front-package.mjs:/check.mjs:ro" \
            public.ecr.aws/lambda/nodejs:22 /check.mjs /var/task

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check
      - name: Verify backendless provider initialization and lock file
        run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate
