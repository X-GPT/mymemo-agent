name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR. Keyed on the PR number, so pushes
# to one PR cancel each other and nothing else.
#
# A push to main has no pull_request.number and falls back to the unique
# run id, putting every main run alone in its own group. That is deliberate
# and load-bearing: release-deploy.yml triggers on `workflow_run` of this
# workflow per commit, and Actions keeps at most one *pending* run per group —
# a third arrival evicts the pending one even with cancel-in-progress false.
# Grouping main at all could therefore silently drop a production deploy.
#
# Groups are repository-wide, not per-workflow, hence the `ci-` prefix.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — match the version the lockfile was
          # generated with. Bump deliberately alongside local upgrades.
          bun-version: 1.3.0
      # Integration tests drive real ripgrep plus disposable Redis processes for
      # the pub/sub relay contract; the runner image does not ship either executable.
      - name: Install real Redis and ripgrep test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep redis-server
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun test e2e/relay-failure-matrix.integration.test.ts

  agentcore-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: bun install --frozen-lockfile
      - run: bun test scripts/agentcore-canary-infra.test.ts scripts/deploy/agentcore_canary_plan.test.ts
      - run: terraform -chdir=infra/agentcore-canary fmt -check
      - name: Verify backendless provider initialization and lock file
        run: terraform -chdir=infra/agentcore-canary init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/agentcore-canary validate

  # The agent-worker image build lives in worker-image.yml, path-filtered.

  # Split-runtime AG-UI integration: runs chat-api plus a deterministic
  # test-only worker against real Postgres and Redis, so atomic admission,
  # durable completion, and relay-backed streaming are exercised on every PR
  # without live provider credentials. Task 9.7 owns the production SDK path's
  # credentialed smoke.
  #
  # It also carries the Claim protocol's concurrency suite, which needs
  # genuinely concurrent backends the PGlite harness structurally cannot
  # provide. Both suites are gated on AGENT_DATABASE_URL.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The major production runs (RDS `agent_db_engine_version`). The
        # concurrency suite below is only evidence about production while these
        # match.
        image: postgres:17
        env:
          POSTGRES_USER: mymemo
          POSTGRES_PASSWORD: mymemo
          POSTGRES_DB: mymemo_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymemo -d mymemo_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AGENT_DATABASE_URL: postgresql://mymemo:mymemo@localhost:5432/mymemo_agent
      DB_SSL: disable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: bun install --frozen-lockfile
      # Apply the @mymemo/agent-db migrations to the service DB before the apps boot.
      - run: bun run db:migrate
        working-directory: apps/chat-api
      # Ahead of the AG-UI lane: the Claim is global, so this suite wants a
      # database no other suite has left claimable Conversations in.
      - run: bun test packages/agent-db/src/conversation-ownership.postgres.test.ts
      - run: bun test e2e/integration.test.ts
