name: Release deploy

# Trunk-based continuous deploy with hybrid lanes (private-repo friendly: no
# GitHub environment features are used — the deploy role's OIDC trust is
# pinned to runs on refs/heads/main instead, see infra/bootstrap-iam):
# - Every CI-green push to main deploys that exact commit automatically.
# - The plan job builds and pushes images, then classifies the Terraform plan
#   (scripts/deploy/classify_terraform_plan.sh). An app-only plan — just the
#   image-tag task-definition roll — applies unattended. Any other change
#   fails the automatic run with instructions; a human applies it by
#   re-running via workflow_dispatch with the typed confirm phrase.
# - After the ordinary Terraform apply and compatible migration, the same
#   deploy job updates the AgentCore Runtime and consumer from their independent
#   state, preserves the operator-owned SSM Dispatch value, then rolls ECS.
# - workflow_dispatch (from main only; other refs cannot assume the deploy
#   role) also covers bootstrap, re-deploys, and incident response.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        type: choice
        options:
          - prod
        required: true
        default: "prod"
      confirm_prod_apply:
        description: "Type apply-mymemo-agent-prod to apply infra-lane (non-app) Terraform changes."
        required: true

concurrency:
  group: release-deploy-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  DEPLOY_CONFIG: infra/deploy/${{ inputs.environment || 'prod' }}.env
  AGENTCORE_TERRAFORM_DIR: infra/agentcore
  AGENTCORE_DISPATCH_PARAMETER: /mymemo/agentcore-dispatch/prod/enabled
  RDS_CA_DIGEST: e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3
  # The commit CI validated (workflow_run) or the dispatched ref's head — the
  # only commit this workflow builds, plans, and applies.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
      chat_api_image: ${{ steps.images.outputs.chat_api_image }}
      agent_worker_image: ${{ steps.images.outputs.agent_worker_image }}
      agentcore_dispatch_publisher_image: ${{ steps.images.outputs.agentcore_dispatch_publisher_image }}
      first_deploy: ${{ steps.agent_deploy_state.outputs.first_deploy }}
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Load deploy config
        run: |
          set -euo pipefail
          set -a
          source "${DEPLOY_CONFIG}"
          set +a

          : "${AWS_REGION:?AWS_REGION is required in ${DEPLOY_CONFIG}}"
          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is required in ${DEPLOY_CONFIG}}"
          : "${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required in ${DEPLOY_CONFIG}}"

          {
            printf 'AWS_REGION=%s\n' "${AWS_REGION}"
            printf 'AWS_ACCOUNT_ID=%s\n' "${AWS_ACCOUNT_ID}"
            printf 'DEPLOY_ENVIRONMENT=%s\n' "${DEPLOY_ENVIRONMENT}"
          } >> "${GITHUB_ENV}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/mymemo-agent-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute immutable image tag
        id: image_tag
        run: |
          short_sha="${DEPLOY_SHA::7}"
          image_tag="release-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image_tag. Use a Docker tag: 1-128 chars, starting with alphanumeric or underscore, then alphanumeric, underscore, dot, or dash." >&2
            exit 1
          fi

          printf 'IMAGE_TAG=%s\n' "${image_tag}" >> "${GITHUB_ENV}"
          printf 'image_tag=%s\n' "${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Ensure ECR repositories
        run: |
          terraform -chdir=infra/ecr init
          terraform -chdir=infra/ecr apply -auto-approve -var="aws_region=${AWS_REGION}"

      - name: Resolve image references
        id: images
        run: |
          chat_api_repository_url="$(terraform -chdir=infra/ecr output -raw chat_api_ecr_repository_url)"
          agent_worker_repository_url="$(terraform -chdir=infra/ecr output -raw agent_worker_ecr_repository_url)"
          agentcore_dispatch_publisher_repository_url="$(terraform -chdir=infra/ecr output -raw agentcore_dispatch_publisher_ecr_repository_url)"
          printf 'chat_api_image=%s:%s\n' "${chat_api_repository_url}" "${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'agent_worker_image=%s:%s\n' "${agent_worker_repository_url}" "${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'agentcore_dispatch_publisher_image=%s:%s\n' "${agentcore_dispatch_publisher_repository_url}" "${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Terraform variables
        run: scripts/deploy/ci_prepare_tfvars.sh

      - name: Detect first ECS service deploy
        id: agent_deploy_state
        run: |
          first_deploy="$(scripts/deploy/detect_first_agent_deploy.sh)"
          printf 'first_deploy=%s\n' "${first_deploy}" >> "${GITHUB_OUTPUT}"

      - name: Build and push chat-api image
        run: scripts/deploy/build_and_push_agent_image.sh chat-api

      - name: Build and push agent-worker image
        run: scripts/deploy/build_and_push_agent_image.sh agent-worker

      - name: Build and push AgentCore dispatch publisher image
        run: scripts/deploy/build_and_push_agent_image.sh agentcore-dispatch-publisher

      - name: Terraform plan
        run: scripts/deploy/terraform_prod_in_place_plan.sh

      - name: Classify plan into a deploy lane
        id: classify
        env:
          FIRST_DEPLOY: ${{ steps.agent_deploy_state.outputs.first_deploy }}
        run: |
          if [[ "${FIRST_DEPLOY}" == "true" ]]; then
            lane="infra"
          else
            lane="$(scripts/deploy/classify_terraform_plan.sh)"
          fi
          echo "Deploy lane: ${lane}"
          printf 'lane=%s\n' "${lane}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      # Pin the exact images the plan job pushed so this job never resolves
      # ECR outputs (ci_prepare_tfvars.sh short-circuits on these).
      CHAT_API_IMAGE: ${{ needs.plan.outputs.chat_api_image }}
      AGENT_WORKER_IMAGE: ${{ needs.plan.outputs.agent_worker_image }}
      AGENTCORE_DISPATCH_PUBLISHER_IMAGE: ${{ needs.plan.outputs.agentcore_dispatch_publisher_image }}
      FIRST_DEPLOY: ${{ needs.plan.outputs.first_deploy }}
      # App lane: human intent is the CI-green merge, so the phrase is
      # supplied automatically. Infra lane: the operator must have typed it
      # into the workflow_dispatch input (validated by the apply script).
      CONFIRM_AGENT_PROD_APPLY: ${{ needs.plan.outputs.lane == 'app' && 'apply-mymemo-agent-prod' || inputs.confirm_prod_apply }}
    steps:
      # A failed run (rather than a skip) so infra changes waiting for a human
      # are impossible to miss.
      - name: Require manual dispatch for infra changes
        if: needs.plan.outputs.lane == 'infra' && github.event_name != 'workflow_dispatch'
        run: |
          echo "This deploy includes non-app Terraform changes (or is the bootstrap deploy) and cannot apply unattended." >&2
          echo "Review the plan in the plan job's log, then run the 'Release deploy' workflow manually from main with confirm_prod_apply=apply-mymemo-agent-prod." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Load deploy config
        run: |
          set -euo pipefail
          set -a
          source "${DEPLOY_CONFIG}"
          set +a

          : "${AWS_REGION:?AWS_REGION is required in ${DEPLOY_CONFIG}}"
          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is required in ${DEPLOY_CONFIG}}"
          : "${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required in ${DEPLOY_CONFIG}}"

          {
            printf 'AWS_REGION=%s\n' "${AWS_REGION}"
            printf 'AWS_ACCOUNT_ID=%s\n' "${AWS_ACCOUNT_ID}"
            printf 'DEPLOY_ENVIRONMENT=%s\n' "${DEPLOY_ENVIRONMENT}"
          } >> "${GITHUB_ENV}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/mymemo-agent-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Terraform variables
        run: scripts/deploy/ci_prepare_tfvars.sh

      - name: Terraform bootstrap plan
        if: env.FIRST_DEPLOY == 'true'
        env:
          BOOTSTRAP_ZERO_DESIRED_COUNT: true
        run: scripts/deploy/terraform_prod_in_place_plan.sh agent-bootstrap.tfplan

      - name: Terraform bootstrap apply
        if: env.FIRST_DEPLOY == 'true'
        run: scripts/deploy/terraform_prod_in_place_apply.sh agent-bootstrap.tfplan

      - name: Terraform plan
        if: env.FIRST_DEPLOY != 'true'
        run: scripts/deploy/terraform_prod_in_place_plan.sh

      # The plan is recomputed in this job (a saved plan file may embed
      # sensitive values, so it is never passed between jobs as an artifact).
      # Re-classify so state drift between the jobs cannot smuggle infra
      # changes through the unattended lane.
      - name: Confirm plan still qualifies for the unattended lane
        if: env.FIRST_DEPLOY != 'true' && needs.plan.outputs.lane == 'app'
        run: |
          lane="$(scripts/deploy/classify_terraform_plan.sh)"
          if [[ "${lane}" != "app" ]]; then
            echo "Plan gained non-app changes after lane selection; re-run the workflow so it requires manual confirmation." >&2
            exit 1
          fi

      - name: Terraform apply
        if: env.FIRST_DEPLOY != 'true'
        run: scripts/deploy/terraform_prod_in_place_apply.sh

      - name: Run agent DB migrations
        run: scripts/deploy/run_agent_migration.sh

      - name: Terraform plan desired service counts
        if: env.FIRST_DEPLOY == 'true'
        run: scripts/deploy/terraform_prod_in_place_plan.sh

      - name: Terraform apply desired service counts
        if: env.FIRST_DEPLOY == 'true'
        run: scripts/deploy/terraform_prod_in_place_apply.sh

      - name: Initialize AgentCore and capture the operational control
        id: agentcore_state
        run: |
          record_dir="${RUNNER_TEMP}/agentcore-deployment"
          mkdir -p "${record_dir}"

          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" init
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" fmt -check
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" validate

          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${caller_account}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo "The deploy role must target AWS account ${AWS_ACCOUNT_ID}." >&2
            exit 1
          fi

          dispatch_value="$(aws ssm get-parameter \
            --region "${AWS_REGION}" \
            --name "${AGENTCORE_DISPATCH_PARAMETER}" \
            --query Parameter.Value \
            --output text)"
          if [[ "${dispatch_value}" != "enabled" && "${dispatch_value}" != "disabled" ]]; then
            echo "${AGENTCORE_DISPATCH_PARAMETER} must be exactly enabled or disabled." >&2
            exit 1
          fi

          repository_uri="$(terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" output -raw runtime_repository_url)"
          previous_digest="$(terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" output -raw runtime_image_digest)"
          if [[ ! "${previous_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Terraform state contains an invalid Runtime rollback digest." >&2
            exit 1
          fi
          aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names mymemo/agentcore-runtime >/dev/null

          printf 'EXPECTED_DISPATCH_VALUE=%s\n' "${dispatch_value}" >> "${GITHUB_ENV}"
          printf 'ROLLBACK_RUNTIME_IMAGE_DIGEST=%s\n' "${previous_digest}" >> "${GITHUB_ENV}"
          printf 'repository_uri=%s\n' "${repository_uri}" >> "${GITHUB_OUTPUT}"
          printf 'previous_digest=%s\n' "${previous_digest}" >> "${GITHUB_OUTPUT}"

      - name: Build, verify, and push the ARM64 AgentCore Runtime image
        id: agentcore_runtime_image
        env:
          REPOSITORY_URI: ${{ steps.agentcore_state.outputs.repository_uri }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --file apps/agentcore-runtime/Dockerfile \
            --tag mymemo-agentcore-runtime:verified \
            .
          scripts/smoke/agentcore-runtime-image-check.sh mymemo-agentcore-runtime:verified
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag mymemo-agentcore-runtime:verified "${REPOSITORY_URI}:${IMAGE_TAG}"
          docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
          runtime_image_digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name mymemo/agentcore-runtime \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "${runtime_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR returned an invalid Runtime image digest." >&2
            exit 1
          fi
          aws ecr wait image-scan-complete \
            --region "${AWS_REGION}" \
            --repository-name mymemo/agentcore-runtime \
            --image-id imageDigest="${runtime_image_digest}"
          printf 'TF_VAR_runtime_image_digest=%s\n' "${runtime_image_digest}" >> "${GITHUB_ENV}"
          printf 'EXPECTED_RUNTIME_IMAGE_DIGEST=%s\n' "${runtime_image_digest}" >> "${GITHUB_ENV}"
          printf 'runtime_image_digest=%s\n' "${runtime_image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Package the AgentCore consumer Lambda
        run: |
          ca_bundle="${RUNNER_TEMP}/rds-global-bundle.pem"
          consumer_dir="${RUNNER_TEMP}/agentcore-consumer"
          curl --fail --silent --show-error --location \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            --output "${ca_bundle}"
          echo "${RDS_CA_DIGEST}  ${ca_bundle}" | sha256sum --check
          scripts/deploy/build_agentcore_consumer.sh "${consumer_dir}" "${ca_bundle}"
          printf 'TF_VAR_consumer_lambda_package=%s/consumer.zip\n' "${consumer_dir}" >> "${GITHUB_ENV}"

      - name: Plan, classify, and apply AgentCore Runtime and consumer
        run: |
          record_dir="${RUNNER_TEMP}/agentcore-deployment"
          plan_file="${record_dir}/deployment.tfplan"
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" plan -out="${plan_file}"
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" show -json "${plan_file}" > "${record_dir}/deployment-plan.json"
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" show -no-color "${plan_file}" > "${record_dir}/deployment-plan.txt"
          scripts/deploy/classify_agentcore_plan.sh "${plan_file}"
          terraform -chdir="${AGENTCORE_TERRAFORM_DIR}" apply "${plan_file}"

      - name: Enforce AgentCore MMDSv2 and wait for the DEFAULT endpoint
        run: scripts/deploy/enforce_agentcore_mmdsv2.sh "${RUNNER_TEMP}/agentcore-deployment/runtime-readiness.json"

      - name: Verify AgentCore deployment and unchanged Dispatch control
        env:
          DEPLOYED_RUNTIME_IMAGE_DIGEST: ${{ steps.agentcore_runtime_image.outputs.runtime_image_digest }}
        run: |
          record_dir="${RUNNER_TEMP}/agentcore-deployment"
          scripts/deploy/inspect_agentcore.sh | tee "${record_dir}/deployment-inspection.json"
          jq -n \
            --arg commit "${DEPLOY_SHA}" \
            --arg runtimeImageDigest "${DEPLOYED_RUNTIME_IMAGE_DIGEST}" \
            --arg rollbackImageDigest "${ROLLBACK_RUNTIME_IMAGE_DIGEST}" \
            --arg dispatchValue "${EXPECTED_DISPATCH_VALUE}" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{commit:$commit,runtimeImageDigest:$runtimeImageDigest,rollbackImageDigest:$rollbackImageDigest,dispatchValue:$dispatchValue,workflowRun:$workflowRun}' \
            > "${record_dir}/deployment-record.json"

      - name: Roll ECS services
        run: scripts/deploy/roll_ecs_services.sh

      - name: Upload AgentCore deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentcore-deployment
          if-no-files-found: ignore
          retention-days: 30
