name: Release deploy

# Manually dispatched production deploy. The deploy role's OIDC trust is
# pinned to runs on refs/heads/main (see infra/bootstrap-iam), and every apply
# requires the typed workflow input. There is no unattended application lane:
# every unified Terraform plan receives the same operator authorization.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        type: choice
        options:
          - prod
        required: true
        default: "prod"
      confirm_prod_apply:
        description: "Type apply-mymemo-agent-prod to authorize the production Terraform apply."
        required: true

concurrency:
  group: release-deploy-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  DEPLOY_CONFIG: infra/deploy/${{ inputs.environment || 'prod' }}.env
  # The manually dispatched main commit is the only commit this workflow
  # builds, plans, and applies.
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
      agent_runtime_image_digest: ${{ steps.agent_runtime_image.outputs.digest }}
    steps:
      - name: Validate production apply confirmation
        env:
          CONFIRM_AGENT_PROD_APPLY: ${{ inputs.confirm_prod_apply }}
        run: |
          if [[ "${CONFIRM_AGENT_PROD_APPLY}" != "apply-mymemo-agent-prod" ]]; then
            echo "Refusing to start the production release. Set confirm_prod_apply to apply-mymemo-agent-prod." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Load deploy config
        run: |
          set -euo pipefail
          set -a
          source "${DEPLOY_CONFIG}"
          set +a

          : "${AWS_REGION:?AWS_REGION is required in ${DEPLOY_CONFIG}}"
          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is required in ${DEPLOY_CONFIG}}"
          : "${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required in ${DEPLOY_CONFIG}}"

          {
            printf 'AWS_REGION=%s\n' "${AWS_REGION}"
            printf 'AWS_ACCOUNT_ID=%s\n' "${AWS_ACCOUNT_ID}"
            printf 'DEPLOY_ENVIRONMENT=%s\n' "${DEPLOY_ENVIRONMENT}"
            printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_aws_account_id=%s\n' "${AWS_ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/mymemo-agent-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute immutable image tag
        id: image_tag
        run: |
          short_sha="${DEPLOY_SHA::7}"
          image_tag="release-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image_tag. Use a Docker tag: 1-128 chars, starting with alphanumeric or underscore, then alphanumeric, underscore, dot, or dash." >&2
            exit 1
          fi

          printf 'IMAGE_TAG=%s\n' "${image_tag}" >> "${GITHUB_ENV}"
          printf 'image_tag=%s\n' "${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Ensure ECR repositories
        run: |
          terraform -chdir=infra/ecr init

          terraform -chdir=infra/ecr apply -auto-approve -var="aws_region=${AWS_REGION}"

      - name: Prepare Terraform variables
        run: scripts/deploy/ci_prepare_tfvars.sh

      - name: Build and push the ARM64 agent-runtime image
        id: agent_runtime_image
        run: |
          repository_uri="$(terraform -chdir=infra/ecr output -raw agent_runtime_ecr_repository_url)"
          docker buildx build --platform linux/arm64 --load \
            --file apps/agent-runtime/Dockerfile --tag mymemo-agent-runtime:verified .
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag mymemo-agent-runtime:verified "${repository_uri}:${IMAGE_TAG}"
          docker push "${repository_uri}:${IMAGE_TAG}"
          digest="$(aws ecr describe-images --region "${AWS_REGION}" \
            --repository-name "${repository_uri#*/}" --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'TF_VAR_agent_runtime_image_digest=%s\n' "${digest}" >> "${GITHUB_ENV}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Package the front Lambda
        run: |
          scripts/deploy/build_front.sh "${RUNNER_TEMP}/agent-front"
          printf 'TF_VAR_front_lambda_package=%s/agent-front/front.zip\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-front-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-front/front.zip
          if-no-files-found: error
          retention-days: 7

      - name: Terraform plan
        run: scripts/deploy/terraform_prod_in_place_plan.sh

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      TF_VAR_agent_runtime_image_digest: ${{ needs.plan.outputs.agent_runtime_image_digest }}
      EXPECTED_RUNTIME_IMAGE_DIGEST: ${{ needs.plan.outputs.agent_runtime_image_digest }}
      CONFIRM_AGENT_PROD_APPLY: ${{ inputs.confirm_prod_apply }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Load deploy config
        run: |
          set -euo pipefail
          set -a
          source "${DEPLOY_CONFIG}"
          set +a

          : "${AWS_REGION:?AWS_REGION is required in ${DEPLOY_CONFIG}}"
          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is required in ${DEPLOY_CONFIG}}"
          : "${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required in ${DEPLOY_CONFIG}}"

          {
            printf 'AWS_REGION=%s\n' "${AWS_REGION}"
            printf 'AWS_ACCOUNT_ID=%s\n' "${AWS_ACCOUNT_ID}"
            printf 'DEPLOY_ENVIRONMENT=%s\n' "${DEPLOY_ENVIRONMENT}"
            printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_aws_account_id=%s\n' "${AWS_ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/mymemo-agent-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Terraform variables
        run: scripts/deploy/ci_prepare_tfvars.sh

      - uses: actions/download-artifact@v8
        with:
          name: agent-front-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-front

      - name: Use the planned front package
        run: |
          test -f "${RUNNER_TEMP}/agent-front/front.zip"
          printf 'TF_VAR_front_lambda_package=%s/agent-front/front.zip\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Terraform plan
        run: scripts/deploy/terraform_prod_in_place_plan.sh

      - name: Apply the unified release
        run: scripts/deploy/terraform_prod_in_place_apply.sh

      - name: Enforce AgentCore MMDSv2 and wait for the DEFAULT endpoint
        run: |
          scripts/deploy/enforce_agentcore_mmdsv2.sh "${RUNNER_TEMP}/agentcore-deployment/runtime-readiness.json"

      - name: Verify AgentCore deployment
        env:
          DEPLOYED_RUNTIME_IMAGE_DIGEST: ${{ needs.plan.outputs.agent_runtime_image_digest }}
        run: |
          set -o pipefail
          record_dir="${RUNNER_TEMP}/agentcore-deployment"
          mkdir -p "${record_dir}"
          scripts/deploy/inspect_agentcore.sh | tee "${record_dir}/deployment-inspection.json"
          jq -n \
            --arg commit "${DEPLOY_SHA}" \
            --arg runtimeImageDigest "${DEPLOYED_RUNTIME_IMAGE_DIGEST}" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{commit:$commit,runtimeImageDigest:$runtimeImageDigest,workflowRun:$workflowRun}' \
            > "${record_dir}/deployment-record.json"

      - name: Upload AgentCore deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentcore-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentcore-deployment
          if-no-files-found: ignore
          retention-days: 30
